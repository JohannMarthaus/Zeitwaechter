<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeitwächter">
<meta name="theme-color" content="#15102b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;overscroll-behavior:none}
body{font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
*{touch-action:manipulation}
</style>
<title>Zeitwächter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
textarea{-webkit-user-select:text;user-select:text}

:root{
  /* Layout: Hochformat-Kampfbildschirm – Gegner-Bühne oben, Team-Leiste in der Mitte, Kugelfeld unten. Bewusst nur ein dunkles Comic-Weltraum-Thema. */
  color-scheme:dark;
  --bg:#15102b;
  --panel:#231a48;
  --panel-2:#2f2462;
  --ink:#120c22;
  --paper:#fff4d6;
  --text:#f5efe0;
  --muted:#aaa0cf;
  --accent:#ffcf3a;
  --hot:#ff5a4e;
  --good:#5be37d;
  --display:'Bangers','Impact','Arial Black',sans-serif;
  --body:'Comic Neue','Trebuchet MS','Segoe UI',sans-serif;
}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);
  background-size:37px 37px,23px 23px;background-position:0 0,11px 17px;
  color:var(--text);font-family:var(--body);font-weight:700;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{height:100%;max-width:520px;margin:0 auto;box-sizing:border-box;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{height:100%;display:flex;flex-direction:column;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}

/* Buttons */
.btn{font-family:var(--display);font-size:22px;letter-spacing:.05em;line-height:1;background:var(--accent);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;padding:10px 18px 8px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:18px;padding:7px 12px 5px}
.btn.ghost{background:var(--panel-2);color:var(--text)}
.btn.red{background:var(--hot);color:#fff}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}

/* Karte */
#scrMap{overflow-y:auto;padding-block:14px 24px;gap:14px}
.hero{position:relative;text-align:center;padding:22px 8px 14px;border:3px solid var(--ink);border-radius:18px;
  background:
   repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.10) 0 7deg,transparent 7deg 14deg),
   radial-gradient(circle at 50% 60%,#ff7a3d,#c73a5c 45%,#3b1f73 80%);
  box-shadow:5px 5px 0 var(--ink);overflow:hidden;flex:none}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.25) 1.2px,transparent 1.8px) 0 0/7px 7px;pointer-events:none}
.logo{position:relative;z-index:1;font-family:var(--display);font-size:clamp(38px,11.5vw,62px);line-height:.9;letter-spacing:.03em;color:var(--accent);
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg);margin:0;text-wrap:balance}
.tag{position:relative;z-index:1;display:inline-block;margin-top:10px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  border-radius:10px;padding:4px 10px;font-size:15px;transform:rotate(1.5deg)}
.teamPeek{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:10px;box-shadow:4px 4px 0 var(--ink);flex:none}
.teamPeek .faces{display:flex;flex:1;min-width:0}
.teamPeek .faces div{width:40px;height:40px;border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-right:-6px;flex:none}
.secTitle{font-family:var(--display);font-size:24px;letter-spacing:.05em;margin:6px 2px 0;color:var(--accent);flex:none}
#levels{display:flex;flex-direction:column;gap:12px;flex:none}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--ink);
  border-radius:14px;padding:10px 12px;box-shadow:4px 4px 0 var(--ink)}
.lvl:nth-child(odd){transform:rotate(-.5deg)}
.lvl:nth-child(even){transform:rotate(.5deg)}
.lvl .num{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--ink);border:3px solid var(--ink);
  display:grid;place-items:center;font-family:var(--display);font-size:24px}
.lvl.done .num{background:var(--good)}
.lvl.locked{opacity:.5}
.lvl.locked .num{background:var(--panel-2);color:var(--muted)}
.lvl h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.04em;font-weight:400}
.lvl p{margin:2px 0 4px;color:var(--muted);font-size:14px}
.lvl .info{min-width:0}
.foes{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.foes img{width:18px;height:18px}
.foot{display:flex;justify-content:center;flex:none;margin-top:4px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* Team-Bildschirm */
#scrTeam{overflow-y:auto;padding-block:14px 24px;gap:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.topbar h2{margin:0;font-family:var(--display);font-size:30px;letter-spacing:.05em;font-weight:400;color:var(--accent);-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;flex:none}
.slot{aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;overflow:hidden;padding:0;background:var(--panel-2);position:relative}
.slot.empty{display:grid;place-items:center;color:var(--muted);font-size:12px;border-style:dashed;border-color:var(--muted)}
.slot.lead{box-shadow:0 0 0 3px var(--accent)}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);flex:none}
.sum b{color:var(--text);font-variant-numeric:tabular-nums}
#roster{display:flex;flex-direction:column;gap:10px;flex:none}
.rrow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:9px;box-shadow:3px 3px 0 var(--ink)}
.rrow.in{background:var(--panel-2);box-shadow:3px 3px 0 var(--ink),inset 0 0 0 2px var(--accent)}
.rrow .pic{width:62px;height:62px;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.rrow .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rrow .nm b{font-family:var(--display);font-size:20px;letter-spacing:.04em;font-weight:400}
.rrow .nm img{width:18px;height:18px}
.chip{font-size:11px;background:var(--ink);color:var(--accent);border-radius:6px;padding:1px 6px}
.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pw{font-size:13px;line-height:1.3}
.pw em{font-style:normal;color:var(--accent)}
.rrow .act{margin-top:4px;align-self:flex-start}

/* Kampf */
#scrBattle{position:relative;padding-block:6px 8px}
#bHead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;padding-bottom:4px}
#bHead .btn.sm{font-size:15px;padding:5px 8px 3px;white-space:nowrap}
#bTitle{font-family:var(--display);font-size:20px;letter-spacing:.05em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bWave{font-size:13px;color:var(--muted);white-space:nowrap}
#stage{flex:1 1 auto;min-height:90px;align-items:stretch!important;position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:8px 4px 6px;box-shadow:inset 0 -30px 40px rgba(0,0,0,.35)}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.22) 1.1px,transparent 1.7px) 0 0/8px 8px;pointer-events:none}
.enemy{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;width:min(31%,128px,var(--eh,128px));cursor:pointer;transition:opacity .5s,transform .5s;min-height:0}
.enemy.boss{width:min(58%,230px,calc(var(--eh,230px) * 1.05))}
.efig{position:relative;width:100%;min-height:0;flex:0 1 auto;display:flex;justify-content:center;align-items:flex-end;overflow:visible}
.efig svg{width:100%;height:auto;max-height:100%;max-width:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.enemy.hit .efig{animation:hit .32s}
.enemy.act .efig{animation:lunge .45s}
.enemy.dead{opacity:0;transform:scale(.5) rotate(-12deg);pointer-events:none}
.enemy.tgt .efig::after{content:"";position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:3px dashed var(--accent);border-radius:50%;animation:spin 6s linear infinite;pointer-events:none}
.ename{display:flex;align-items:center;gap:3px;font-size:11px;background:rgba(18,12,34,.75);border-radius:6px;padding:1px 5px;white-space:nowrap;max-width:100%;overflow:hidden}
.ename img{width:13px;height:13px;flex:none}
.ehp{width:92%;height:9px;border:2px solid var(--ink);border-radius:6px;background:#3a1f2a;overflow:hidden}
.ehp i{display:block;height:100%;background:linear-gradient(#ff8a6b,#e8432e);transition:width .25s}
.ecd{position:absolute;left:0;top:0;z-index:2;min-width:26px;height:26px;border-radius:50%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  display:grid;place-items:center;font-family:var(--display);font-size:17px;line-height:1}
.ecd.soon{background:var(--hot);color:#fff;animation:pulse .8s infinite}
.estat{position:absolute;right:0;top:0;z-index:2;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.estat span{font-size:10px;line-height:1;background:var(--ink);border:2px solid var(--paper);border-radius:6px;padding:2px 4px;white-space:nowrap}
.estat .sh{color:#9fd2ff}.estat .ps{color:#a8f0a0}.estat .st{color:var(--accent)}

#team{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:5px;flex:none;max-width:400px;width:100%;margin-inline:auto}
.ally{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:11px;overflow:hidden;padding:0;background:var(--panel-2)}
.ally svg{width:100%;height:100%}
.ally .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(18,12,34,.75)}
.ally .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ally .bar b{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.ally.lead{border-color:var(--accent)}
.ally.ready{animation:glow 1s infinite}
.ally.ready .bar i{background:#fff}
.ally .aff{position:absolute;top:1px;right:2px;font-size:13px;line-height:1;-webkit-text-stroke:1px var(--ink);font-family:var(--display)}
.ally .aff.up{color:var(--good)}.ally .aff.down{color:var(--hot)}
.ally.bounce{animation:bounce .3s}
.ally.queued{outline:3px dashed #fff;outline-offset:-3px}
.ally .gemtag{position:absolute;left:2px;top:2px;width:15px;height:15px}
#hpWrap{position:relative;margin-top:6px;flex:none}
#hp{height:16px;border:3px solid var(--ink);border-radius:10px;background:#3a1f2a;overflow:hidden}
#hp i{display:block;height:100%;background:linear-gradient(#ff9cc8,#f2559f);transition:width .3s}
#hp.poison i{background:linear-gradient(#b8f07a,#4aa83a)}
#hpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums;
  text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
#timer{height:6px;margin-top:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;flex:none}
#timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
#timer.low i{background:var(--hot)}
#boardWrap{position:relative;margin-top:4px;flex:none;display:flex;justify-content:center;
  margin-left:calc(4px - max(16px,env(safe-area-inset-left,0px)));margin-right:calc(4px - max(16px,env(safe-area-inset-right,0px)))}
#board{display:block;border:3px solid var(--ink);border-radius:14px;touch-action:none;background:#1b1438;box-shadow:0 5px 0 var(--ink)}
#combo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--display);font-size:46px;color:var(--accent);
  -webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);pointer-events:none;opacity:0;white-space:nowrap}
#combo.show{animation:combo .7s forwards}
#chip{position:absolute;right:6px;top:-30px;font-size:12px;background:var(--accent);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:2px 6px}

.float{position:absolute;z-index:30;font-family:var(--display);font-size:28px;letter-spacing:.03em;color:#fff;-webkit-text-stroke:1.5px var(--ink);
  text-shadow:2px 2px 0 var(--ink);pointer-events:none;transform:translate(-50%,-50%);animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.strong{font-size:36px;color:var(--accent)}
.float.weak{font-size:22px;color:#c9c2d8}
.float.c-r{color:#ff8a6b}.float.c-b{color:#8fc8ff}.float.c-g{color:#8ff08a}.float.c-y{color:#ffe066}.float.c-k{color:#c4a8ff}
.float.strong.c-r,.float.strong.c-b,.float.strong.c-g,.float.strong.c-y,.float.strong.c-k{font-size:36px}
.float.heal{color:var(--good)}
.float.hurt{color:var(--hot);font-size:32px}
.float.poison{color:#b8f07a;font-size:22px}
.float.burst{font-size:18px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:3px 9px 1px;animation:burst 1.3s ease-out forwards}
.banner{position:absolute;left:50%;top:30%;z-index:35;transform:translate(-50%,-50%) rotate(-4deg);font-family:var(--display);font-size:44px;
  color:var(--accent);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:banner 1.3s forwards;white-space:nowrap}
.banner.power{font-size:30px;color:#fff;background:var(--hot);-webkit-text-stroke:1px var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 14px 2px;text-shadow:2px 2px 0 var(--ink)}
.shake{animation:shake .35s}

/* Overlay */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(10,6,22,.74);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#overlay.center{align-items:center}
.sheet{width:100%;max-width:480px;background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:16px;
  display:flex;flex-direction:column;gap:10px;animation:pop .25s;max-height:85vh;overflow-y:auto;box-sizing:border-box}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.05em;color:var(--accent);-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink)}
.sheet .row{display:flex;gap:10px;align-items:center}
.sheet .row .pic{width:72px;height:72px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;flex:none}
.sheet p{margin:0;line-height:1.4}
.sheet .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.big{font-family:var(--display);font-size:56px;text-align:center;color:var(--accent);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:0;transform:rotate(-3deg)}
.big.lose{color:var(--hot)}
.lvlups{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.lvlups span{background:var(--ink);border-radius:8px;padding:3px 7px}
.lvlups span b{color:var(--good)}
.recruit{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.recruit .pic{width:64px;height:64px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;flex:none}
.recruit b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.04em}

.dlg{width:100%;max-width:480px;display:flex;align-items:flex-end;gap:8px;animation:pop .2s}
.dpic{width:92px;height:92px;flex:none;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:var(--panel-2)}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 14px 8px;box-shadow:4px 4px 0 var(--ink)}
.bubble::before{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:14px solid var(--ink)}
.bubble::after{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-right:11px solid var(--paper)}
.bubble b{font-family:var(--display);font-size:20px;font-weight:400;letter-spacing:.05em;display:block}
.bubble p{margin:2px 0 4px;font-size:16px;line-height:1.35}
.bubble .next{display:block;text-align:right;font-size:13px;opacity:.6}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--panel-2);border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:13px;color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-size:14px;box-shadow:3px 3px 0 var(--ink);max-width:calc(100% - 40px);text-align:center}

@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-4deg);filter:brightness(2)}60%{transform:translateX(5px)}100%{transform:none}}
@keyframes lunge{0%{transform:none}40%{transform:translateY(14px) scale(1.12)}100%{transform:none}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--accent),0 0 6px var(--accent)}50%{box-shadow:0 0 0 3px #fff,0 0 16px var(--accent)}}
@keyframes bounce{40%{transform:translateY(-9px)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-90%) scale(1.1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) rotate(-4deg)}}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(-4deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1) rotate(-4deg)}}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) rotate(-4deg) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) rotate(-4deg)}}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* V2: Szene, Effekte, Route */
#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:25}
#flash{position:absolute;inset:0;z-index:24;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 60%,transparent 35%,rgba(255,40,60,.55))}
#flash.on{animation:flash .45s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene svg{width:100%;height:100%}
.motes{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:rgba(255,240,200,.7);box-shadow:0 0 8px rgba(255,220,140,.9);animation:mote linear infinite}
@keyframes mote{from{transform:translateY(0)}to{transform:translateY(-320px) translateX(30px);opacity:0}}
.efig::before{content:"";position:absolute;left:18%;right:18%;bottom:-2px;height:10%;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
.efig svg{animation:bob 2.6s ease-in-out infinite}
.enemy:nth-child(2) .efig svg{animation-delay:-.9s}
.enemy:nth-child(3) .efig svg{animation-delay:-1.7s}
@keyframes bob{50%{transform:translateY(-5px)}}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:gear 14s linear infinite}
.spin-rev{transform-box:fill-box;transform-origin:center;animation:gear 10s linear infinite reverse}
@keyframes gear{to{transform:rotate(360deg)}}
#mute{min-width:44px}
.btn{background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 55%)}
#route{position:relative;flex:none}
#route svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:150px}
.node .orb{width:66px;height:66px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--ink);
  background:radial-gradient(circle at 35% 30%,#fff6b0,var(--accent) 45%,#c48a00);box-shadow:0 5px 0 var(--ink),0 0 0 4px rgba(255,207,58,.25)}
.node.done .orb{background:radial-gradient(circle at 35% 30%,#d6ffe0,var(--good) 45%,#1f8a3c)}
.node.locked .orb{background:radial-gradient(circle at 35% 30%,#6c6390,#3a3160 60%,#241c45);color:#8d84b5}
.node.cur .orb{animation:nodePulse 1.4s infinite}
@keyframes nodePulse{50%{box-shadow:0 5px 0 var(--ink),0 0 0 12px rgba(255,207,58,.0),0 0 26px rgba(255,207,58,.9)}}
.node .lbl{font-family:var(--display);font-size:19px;letter-spacing:.04em;background:rgba(18,12,34,.8);border:2px solid var(--ink);border-radius:9px;padding:2px 8px 0;white-space:nowrap}
.node.locked .lbl{color:var(--muted)}
.scene-card{border:3px solid var(--ink);border-radius:14px;overflow:hidden;height:120px;position:relative}
.scene-card .foesRow{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;gap:4px}
.scene-card .foesRow div{width:54px}

/* V4: Tutorial */
#coach{position:absolute;left:0;right:0;z-index:40;display:flex;align-items:flex-end;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:pop .25s}
#coach.top{top:44px}
#coach.bottom{bottom:12px}
#coach .cpic{width:64px;height:64px;flex:none;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
#coach .cb{position:relative;flex:1;min-width:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);pointer-events:auto}
#coach .cb b{font-family:var(--display);font-size:17px;font-weight:400;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
#coach .cb b small{font-family:var(--body);font-size:11px;opacity:.6;letter-spacing:0}
#coach .cb p{margin:2px 0 4px;font-size:15px;line-height:1.35}
#coach .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
#coach .skipT{background:none;border:0;padding:0;font-size:12px;color:var(--ink);opacity:.6;text-decoration:underline}
#coach .btn{font-size:17px;padding:6px 12px 4px}
.hl{animation:hl 1s infinite!important;position:relative;z-index:39}
@keyframes hl{0%,100%{box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--accent)}50%{box-shadow:0 0 0 5px var(--accent),0 0 24px 8px var(--accent)}}
.tutCard{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--panel-2),var(--panel));border:3px solid var(--ink);border-radius:16px;padding:12px;box-shadow:4px 4px 0 var(--ink);flex:none}
.tutCard .pic{width:60px;height:60px;border:3px solid var(--ink);border-radius:12px;overflow:hidden;flex:none}
.tutCard p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tutCard b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.04em}
.tutCard > div{flex:1;min-width:0}
/* V3: Zweifarbige Rahmen, Kapitel, Crew-Raster */
.duo{background:var(--c1);padding:4px;border:2.5px solid var(--ink);border-radius:13px;box-sizing:border-box;position:relative}
.duo .mainb{position:absolute;left:2px;top:2px;width:30%;max-width:20px;z-index:2;filter:drop-shadow(0 1px 0 var(--ink))}
.duo .secb{position:absolute;right:2px;bottom:2px;width:34%;max-width:22px;aspect-ratio:1;border-radius:50%;background:var(--ink);border:2px solid #fff;display:grid;place-items:center;z-index:2;box-sizing:border-box}
.duo .secb img{width:82%}
.duo .secb.lk{border-color:#6c6390}
.duo .secb.lk img{filter:grayscale(1);opacity:.4}
.ally.duo .secb{bottom:9px}
.duo > .in{width:100%;height:100%;border-radius:9px;overflow:hidden;border:2px solid var(--ink);box-sizing:border-box}
.ally.duo{padding:3px}
.ally .gemtag.sec{left:auto;right:3px;top:auto;bottom:9px}
.ally .aff{right:4px;left:auto;top:3px;font-size:15px}
.chaps{display:flex;gap:8px;align-items:center;padding:2px 0 6px;flex:none}
.chapMid{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column}
.chapMid b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.05em}
.chapMid small{color:var(--muted);font-size:12px;min-height:14px}
.chaps::-webkit-scrollbar{display:none}
.chapc{flex:none;font-family:var(--display);font-size:16px;letter-spacing:.04em;background:var(--panel);border:2.5px solid var(--ink);border-radius:10px;padding:6px 10px 4px;color:var(--text);box-shadow:0 3px 0 var(--ink)}
.chapc.on{background:var(--accent);color:var(--ink)}
.chapc.done{box-shadow:0 3px 0 var(--ink),inset 0 -4px 0 var(--good)}
.chapc:disabled{opacity:.45}
.chapHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex:none}
.chapHead .secTitle{margin:0}
.chapHead span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.node .orb{width:56px;height:56px;font-size:24px}
.node.boss .orb{width:72px;height:72px;font-size:20px;background:radial-gradient(circle at 35% 30%,#ffb0a0,var(--hot) 45%,#8a1a12);color:#fff;-webkit-text-stroke:1px var(--ink)}
.node.boss.locked .orb{background:radial-gradient(circle at 35% 30%,#6c6390,#3a3160 60%,#241c45);color:#8d84b5}
.node .lbl{font-size:15px}
.filters{display:flex;gap:5px;flex-wrap:wrap;flex:none}
.filters button{display:flex;align-items:center;gap:4px;background:var(--panel);border:2.5px solid var(--ink);border-radius:9px;padding:4px 8px;font-size:13px}
.filters button.on{background:var(--accent);color:var(--ink)}
.filters img{width:15px;height:15px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;flex:none}
.tile{position:relative;aspect-ratio:1;padding:3px;background:none;border:0}
.tile .duo{width:100%;height:100%}
.tile .lv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--ink);color:var(--text);font-size:11px;border-radius:6px;padding:1px 5px;white-space:nowrap;z-index:2}
.tile .chk{position:absolute;right:-2px;top:-2px;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--good);border:2.5px solid var(--ink);display:grid;place-items:center;font-size:12px;color:var(--ink)}
.tile.sel .duo{outline:3px solid #fff;outline-offset:1px}
#detail{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:10px;box-shadow:4px 4px 0 var(--ink);display:grid;grid-template-columns:76px 1fr;gap:10px;flex:none}
table.st{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%;max-width:280px}
table.st th{font-weight:400;color:var(--muted);text-align:right;padding:1px 6px;font-size:11px}
table.st td{text-align:right;padding:1px 6px;border-top:1px solid rgba(255,255,255,.08)}
table.st td:first-child,table.st th:first-child{text-align:left;padding-left:0;color:var(--muted)}
table.st td.up{color:var(--good)}
.xpb{position:relative;height:16px;border:2px solid var(--ink);border-radius:8px;background:#1a1336;overflow:hidden;max-width:280px}
.xpb i{display:block;height:100%;background:linear-gradient(#9fd2ff,#2f86ea)}
.xpb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;text-shadow:1px 1px 0 var(--ink)}
.ms{display:flex;flex-direction:column;gap:2px;font-size:12px;margin-top:2px}
.ms div{display:flex;gap:8px;color:var(--muted);opacity:.7}
.ms div b{flex:none;width:40px;font-variant-numeric:tabular-nums}
.ms div.got{color:var(--good);opacity:1}
.ms div.got b::after{content:" ✓"}
.ms div.next{color:var(--accent);opacity:1}
.foeList{display:flex;flex-direction:column;gap:6px}
.foe{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:rgba(0,0,0,.2);border-radius:10px;padding:4px 6px}
.foe .f{width:44px}
.foe small{color:var(--muted);display:block;line-height:1.35}
.rec{font-size:13px;padding:6px 8px;border-radius:10px;background:rgba(0,0,0,.25)}
.rec.warn{color:var(--hot)}.rec.ok{color:var(--good)}
.estat .enext{color:var(--ink);font-size:10px;line-height:1;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:2px 4px;white-space:nowrap}
#turnInfo{font-size:11px;color:var(--muted);min-height:14px;line-height:14px;text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;flex:none}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;align-items:center}
.legend img{width:20px;height:20px;vertical-align:-5px}
#detail .duo{width:76px;height:76px}
#detail .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.colors{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.colors span{display:flex;align-items:center;gap:3px}
.colors img{width:16px;height:16px}
.colors .lock img{filter:grayscale(1);opacity:.5}
.slots .duo{width:100%;height:100%}
.slots button.slot{padding:0;border:0;background:none;aspect-ratio:1}
.enemy.elite .efig svg{filter:drop-shadow(0 0 6px #ffcf3a) drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.ename.el{color:var(--accent)}
.startBar{position:sticky;bottom:0;padding-block:10px 4px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;flex:none}

/* Einstellungen */
.set input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.srow b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.04em;display:block}
.srow small{color:var(--muted);font-size:12px}
.tog{flex:none;width:54px;height:32px;border-radius:20px;border:3px solid var(--ink);background:#3a3160;position:relative;padding:0}
.tog i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#bdb5dc;transition:transform .15s,background .15s}
.tog.on{background:var(--good)}
.tog.on i{transform:translateX(22px);background:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:2.5px solid var(--ink);border-radius:10px;background:var(--panel-2);padding:7px 0;font-size:14px}
.seg button.on{background:var(--accent);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#000"/></pattern>
</defs></svg>

<div id="app">
  <section id="scrMap">
    <div class="hero">
      <h1 class="logo">ZEITWÄCHTER</h1>
      <div class="tag">100 Kapitel · 1000 Level</div>
    </div>
    <div class="teamPeek">
      <div class="faces" id="peek"></div>
      <button class="btn sm ghost" id="setBtn" aria-label="Einstellungen">⚙</button><button class="btn sm ghost" id="toTeam">Team</button>
    </div>
    <div id="tutSlot"></div>
    <div class="chaps" id="chaps"></div>
    <div class="chapHead"><div class="secTitle" id="chapName">Kapitel</div><span id="chapProg"></span></div>
    <div id="route"></div>
    <div class="foot" style="gap:14px;flex-wrap:wrap"><button class="link" id="expBtn">Spielstand sichern</button><button class="link" id="impBtn">Spielstand laden</button><button class="link" id="resetBtn">Spielstand zurücksetzen</button></div>
  </section>

  <section id="scrTeam" hidden>
    <div class="topbar"><h2 id="teamTitle">Dein Team</h2><button class="btn sm ghost" id="teamDone">Zurück</button></div>
    <div class="slots" id="slots"></div>
    <div class="sum" id="sum"></div>
    <div id="detail"></div>
    <div class="secTitle" id="crewTitle">Crew</div>
    <div class="filters" id="filters"></div>
    <div id="grid"></div>
    <div class="startBar" id="startBar" hidden><button class="btn" id="startBtn">Kampf starten!</button></div>
  </section>

  <section id="scrBattle" hidden>
    <div id="bHead">
      <div style="min-width:0"><div id="bTitle"></div><div id="bWave"></div></div>
      <div style="display:flex;gap:6px"><button class="btn sm ghost" id="helpBtn" aria-label="Hilfe">?</button><button class="btn sm ghost" id="mute" aria-label="Einstellungen">⚙</button><button class="btn sm ghost" id="quitBtn">Rückzug</button></div>
    </div>
    <div id="stage"></div>
    <div id="team"></div>
    <div id="hpWrap"><div id="hp"><i></i></div><div id="hpTxt"></div></div>
    <div id="timer"><i></i></div>
    <div id="turnInfo">Ziehe eine Kugel, um zu beginnen.</div>
    <div id="coach" hidden></div><div id="flash"></div><canvas id="fx"></canvas>
    <div id="boardWrap"><canvas id="board" aria-label="Kugelfeld"></canvas><div id="combo"></div><div id="chip" hidden></div></div>
  </section>
</div>
<div id="overlay" hidden></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const INK = '#120c22';
const COLS = 6, ROWS = 5;
const COLORS = ['r','b','g','y','k','p'];
const GEMC = {
  r:{name:'Rot',    base:'#e8432e',light:'#ffa37d',dark:'#7d1710',sym:'#ffe08a'},
  b:{name:'Blau',   base:'#2f86ea',light:'#a6d6ff',dark:'#123f86',sym:'#e6f4ff'},
  g:{name:'Grün',   base:'#33b04a',light:'#b2f2a2',dark:'#10561f',sym:'#efffd0'},
  y:{name:'Gelb',   base:'#f5bf1f',light:'#fff1a6',dark:'#8a5d00',sym:'#fffbe8'},
  k:{name:'Schwarz',base:'#4b2d86',light:'#a88be6',dark:'#170b33',sym:'#ddccff'},
  p:{name:'Pink',   base:'#f2559f',light:'#ffc6e2',dark:'#86184f',sym:'#fff0f7'},
  s:{name:'Stein',  base:'#8b8f9b',light:'#dcdee4',dark:'#3d404a',sym:'#eceef2'}
};
const STRONG = {r:'g', g:'b', b:'r', y:'k', k:'y'};
const WEAK = {r:'b', g:'r', b:'g'};
const aff = (a, d) => STRONG[a] === d ? 2 : (WEAK[a] === d ? 0.5 : 1);
const PBG = {r:'#ff8f72', b:'#7fbaff', g:'#86de8f', y:'#ffd966', k:'#a68bdc', p:'#ff9cc8'};

/* ---------- Figuren ---------- */
const CHARS = {
  ilka:   {name:'Ilka Vey', role:'Anführerin', color:'b', hp:400, atk:95, heal:30,
           look:{skin:'#f2c7a5',hair:'#ebe5dc',style:'bob',outfit:'#2f86ea',acc:['goggles']},
           power:{name:'Chronosprung', t1:12, t2:24, fx1:[{type:'stun',turns:1}], fx2:[{type:'stun',turns:2},{type:'heal',pct:.25}],
                  d1:'Betäubt alle Gegner 1 Runde.', d2:'Betäubt alle Gegner 2 Runden und heilt 25 % HP.'}},
  rook:   {name:'Rook Ardent', role:'Angreifer', color:'r', hp:360, atk:130, heal:12,
           look:{skin:'#c98a5e',hair:'#2b1a12',style:'spiky',outfit:'#c62f22',acc:['scar']},
           power:{name:'Funkenschlag', cd:8, fx:[{type:'dmgAll',amt:500,color:'r'}], d:'500 roter Schaden an alle Gegner.'}},
  mila:   {name:'Mila Sorn', role:'Heilerin', color:'g', hp:380, atk:72, heal:55,
           look:{skin:'#f6d3b8',hair:'#c4562e',style:'bun',outfit:'#2f9a46',acc:['glasses']},
           power:{name:'Feldlazarett', cd:6, fx:[{type:'heal',pct:.3}], d:'Heilt das Team um 30 % der max. HP.'}},
  bolt:   {name:'Bolt', role:'Robo-Tank', color:'y', hp:520, atk:82, heal:20, look:{robot:true},
           power:{name:'Überladung', cd:5, fx:[{type:'boost',color:'y',pct:.15}], d:'Alle gelben Kugeln auf dem Feld: +15 % Schaden.'}},
  nox:    {name:'Nox Varga', role:'Angreiferin', color:'k', hp:340, atk:122, heal:15,
           look:{skin:'#eadbd2',hair:'#1c1630',style:'long',outfit:'#3c2470',acc:['scarf'],scarf:'#a88be6'},
           power:{name:'Schattenwandel', cd:7, fx:[{type:'convert',from:'g',to:'k'}], d:'Wandelt alle grünen Kugeln in schwarze.'}},
  juno:   {name:'Juno Kade', role:'Stellwerkerin', color:'b', hp:400, atk:104, heal:30,
           look:{skin:'#8a5a3c',hair:'#16110d',style:'wild',outfit:'#2a6fd0',acc:['headband']},
           power:{name:'Fahrplanwechsel', cd:4, fx:[{type:'time',sec:4}], d:'+4 Sekunden Zugzeit für den nächsten Zug.'}},
  tamsin: {name:'Tamsin Reed', role:'Feuerwerkerin', color:'r', hp:390, atk:112, heal:26,
           look:{skin:'#f0c09a',hair:'#f2a83a',style:'buzz',outfit:'#d8452e',acc:['goggles']},
           power:{name:'Glutregen', cd:7, fx:[{type:'convert',from:'b',to:'r'}], d:'Wandelt alle blauen Kugeln in rote.'}},
  ottilie:{name:'Ottilie Brass', role:'Uhrmacherin', color:'y', hp:410, atk:98, heal:40,
           look:{skin:'#f4d9c4',hair:'#7a7a86',style:'bun',outfit:'#d9a514',acc:['tophat','glasses']},
           power:{name:'Feinjustierung', cd:6, fx:[{type:'purify'}], d:'Steine werden zu Pink, alle Sperren lösen sich.'}},
  kasimir:{name:'Kasimir Quell', role:'Stadtwächter', color:'g', hp:470, atk:96, heal:28,
           look:{skin:'#d8a07a',hair:'#5a3a1c',style:'buzz',outfit:'#2b8c3e',acc:['beard']},
           power:{name:'Haltesignal', cd:9, fx:[{type:'stun',turns:2}], d:'Betäubt alle Gegner 2 Runden.'}},
  vesper: {name:'Vesper', role:'Ex-Wächterin', color:'k', hp:380, atk:135, heal:18,
           look:{skin:'#e4dce6',hair:'#8f3fd0',style:'long',outfit:'#2a1850',acc:['eyepatch']},
           power:{name:'Rostgift', cd:6, fx:[{type:'poison',pct:.08,turns:3}], d:'Vergiftet das Ziel: 8 % seiner max. HP pro Runde, 3 Runden.'}}
};

/* Zweitfarben der festen Figuren (aktiv ab Level 10) */
const SEC_LV = 10;
Object.entries({ilka:'y', rook:'y', mila:'b', bolt:'k', nox:'g', juno:'y', tamsin:'g', ottilie:'b', kasimir:'r', vesper:'r'}).forEach(([k, v]) => CHARS[k].sec = v);

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const C5 = ['r','b','g','y','k'];
function fxDesc(fx) {
  return fx.map(f => {
    switch (f.type) {
      case 'dmgAll': return `${f.amt} ${GEMC[f.color].name.toLowerCase()}er Schaden an alle Gegner.`;
      case 'dmgOne': return `${f.amt} ${GEMC[f.color].name.toLowerCase()}er Schaden an das Ziel.`;
      case 'heal': return `Heilt das Team um ${Math.round(f.pct * 100)} % der max. HP.`;

const AUD = (() => {
  let ac = null, master, sfx, music;
  function init() {
    if (ac) return ac;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = ac.createGain(); sfx = ac.createGain(); music = ac.createGain();
    sfx.connect(master); music.connect(master); master.connect(ac.destination);
    apply(); return ac;
  }
  function apply() {

    const t = ac.currentTime, sq = v => v * v;
    master.gain.setTargetAtTime(SET.get('masterOn') ? sq(SET.get('master')) : 0, t, .05);
    sfx.gain.setTargetAtTime(sq(SET.get('sfx')), t, .05);
    music.gain.setTargetAtTime(SET.get('musicOn') ? sq(SET.get('music')) * .9 : 0, t, .3);
  }
  function ctx() { const a = init(); if (a && a.state === 'suspended' && !document.hidden) a.resume(); return a; }
  return {ctx, apply, get sfx() { return sfx; }, get music() { return music; }, get ac() { return ac; }};
})();

const SND = (() => {
  const live = () => SET.get('masterOn') && SET.get('sfx') > 0;
  function tone(f, d, type, v, f2, delay) {
    if (!live()) return; const a = AUD.ctx(); if (!a) return; const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .06, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AUD.sfx); o.start(t); o.stop(t + d + .03);
  }
  function noise(d, v, hp, delay) {
    if (!live()) return; const a = AUD.ctx(); if (!a) return; const t = a.currentTime + (delay || 0);
    const b = a.createBuffer(1, Math.floor(a.sampleRate * d), a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const src = a.createBufferSource(); src.buffer = b; const fl = a.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = hp; const g = a.createGain(); g.gain.value = v;
    src.connect(fl); fl.connect(g); g.connect(AUD.sfx); src.start(t);
  }
  return {
    unlock() { AUD.ctx(); MUS.ensure(); },
    pick() { tone(520, .07, 'triangle', .06, 820); HAP.buzz(1); },
    swap(n) { tone(280 + Math.min(n, 30) * 16, .05, 'triangle', .035); HAP.buzz(1); },
    combo(n) { const f = 392 * Math.pow(2, Math.min(n - 1, 14) / 6); tone(f, .16, 'square', .04); tone(f * 1.5, .22, 'sine', .05, 0, .03); HAP.buzz(2); },

    heal() { [660, 880, 1175].forEach((f, i) => tone(f, .2, 'sine', .05, 0, i * .07)); },
    power() { tone(220, .55, 'sawtooth', .05, 880); noise(.45, .07, 2000, .12); HAP.buzz(3); },
    enemy() { tone(120, .35, 'sawtooth', .09, 45); noise(.25, .16, 300); HAP.buzz(3); },
    debuff() { tone(520, .32, 'square', .035, 170); HAP.buzz(2); },
    tick() { tone(1250, .03, 'square', .025); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .32, 'triangle', .07, 0, i * .12)); HAP.buzz(3); },

/* Hintergrundmusik: live erzeugt, drei Stimmungen */
const MUS = (() => {
  let timer = null, next = 0, step = 0, mode = 'map';
  const PROG = {map:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], battle:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]], boss:[[50,53,57],[46,50,53],[48,52,55],[45,49,52]]};
  const BPM = {map:84, battle:112, boss:126};
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, d, type, v, cut) {
    const a = AUD.ac, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(hz(m), t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(.03, d / 4)); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    if (cut) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; o.connect(f); f.connect(g); } else o.connect(g);
    g.connect(AUD.music); o.start(t); o.stop(t + d + .05);
  }
  function drum(t, kick) {
    const a = AUD.ac;
    if (kick) { const o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
      g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g); g.connect(AUD.music); o.start(t); o.stop(t + .2); return; }
    const b = a.createBuffer(1, Math.floor(a.sampleRate * .04), a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = 'highpass'; f.frequency.value = 7000; g.gain.value = .08;
    s.connect(f); f.connect(g); g.connect(AUD.music); s.start(t);
  }
  function play(s, t) {
    const sp = 60 / BPM[mode] / 4, bar = Math.floor(s / 16) % 4, pos = s % 16, ch = PROG[mode][bar], calm = mode === 'map';
    if (pos === 0) ch.forEach(m => note(m, t, sp * 16, 'sine', calm ? .035 : .025, 0));
    if (pos % 8 === 0) note(ch[0] - 24, t, sp * (calm ? 7 : 3.5), 'triangle', .2, 0);
    if (!calm && pos % 4 === 2) note(ch[0] - 12, t, sp * 1.5, 'triangle', .12, 0);
    if (calm ? pos % 2 === 0 : true) note(ch[(pos >> (calm ? 1 : 0)) % 3] + (pos >= 8 ? 24 : 12), t, sp * (calm ? 1.8 : .9), 'square', calm ? .02 : .022, calm ? 1400 : 2200);
    if (!calm) { if (pos % 4 === 0) drum(t, true); if (pos % 2 === 1) drum(t, false); if (mode === 'boss' && pos === 14) drum(t, true); }
  }
  function tick() {
    const a = AUD.ac; if (!a || a.state !== 'running') return;
    if (next < a.currentTime) next = a.currentTime + .05;
    while (next < a.currentTime + .3) { play(step, next); next += 60 / BPM[mode] / 4; step++; }
  }
  return {
    ensure() { if (!timer && AUD.ctx()) timer = setInterval(tick, 90); },
    setMode(m) { if (m === mode) return; mode = m; step = 0; }
  };
})();

/* Vibration: Android über navigator.vibrate, iPhone (ab iOS 18) über ein unsichtbares Schalter-Element */
const HAP = (() => {
  let lab = null;
  function ios() {
    const l = document.createElement('label'); l.setAttribute('aria-hidden', 'true'); l.style.display = 'none';
    const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i);
    document.head.appendChild(l); l.click(); document.head.removeChild(l);
  }
  return {
    buzz(level) {
      if (!SET.get('vib')) return;
      const st = SET.get('vibStr');
      if (navigator.vibrate) { try { navigator.vibrate(Math.round([8, 18, 35][st - 1] * level)); } catch (e) {} return; }
      const n = Math.max(1, Math.min(4, Math.round((st + level - 1) / 2)));
      for (let i = 0; i < n; i++) setTimeout(() => { try { ios(); } catch (e) {} }, i * 60);
    }
  };
})();

async function resolveAttacks(combos) {

    if (g.n >= 5) big[g.color] = true;
  });

    B.teamHp = Math.min(B.teamMax, B.teamHp + h); B.healTurn = h; floatAt($('#hp'), '+' + h, 'heal'); SND.heal();
    const [hx, hy] = relCenter($('#hp')); FX.burst(hx, hy, '#ffc6e2', 22, 4);
    refreshTeam(); await sleep(300);

      const targets = big[col] ? alive() : [curTarget()];

  const next = n < MAXN ? n + 1 : null;
  const ov = $('#overlay'); ov.className = 'center'; ov.hidden = false;
  const upTxt = [...new Set(ups)].map(id => `<span>${CHARS[id].name.split(' ')[0]} <b>Lv ${save.roster[id].lvl}</b></span>`).join('');
  ov.innerHTML = `<div class="sheet">
    <p class="big">SIEG!</p>
    <p style="text-align:center">Level ${n} geschafft · jedes Teammitglied erhält <b style="color:var(--accent)">+${L.xp} XP</b></p>
    ${upTxt ? `<div class="lvlups">Level-Up: ${upTxt}</div>` : ''}
    <div style="display:flex;flex-direction:column;gap:4px">${ids.map(id => { const R = save.roster[id], nm = MS.find(m => R.lvl < m.lv);
      return `<div style="display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font-size:12px"><span>${CHARS[id].name.split(' ')[0]} · ${R.lvl}</span><div><div class="xpb"><i style="width:${Math.min(100, R.xp / xpNeed(R.lvl) * 100)}%"></i><span>${R.xp}/${xpNeed(R.lvl)}</span></div>${nm ? `<small style="color:var(--muted)">Lv ${nm.lv}: ${msText(nm, id)}</small>` : ''}</div></div>`; }).join('')}</div>
    ${secNew.map(id => `<div class="recruit"><div class="pic">${duo(id)}</div><div><small>Zweitfarbe freigeschaltet</small><br><b>${CHARS[id].name}</b><br><small>greift jetzt auch bei ${GEMC[CHARS[id].sec].name} an</small></div></div>`).join('')}
    ${recruit ? `<div class="recruit"><div class="pic">${duo(recruit)}</div><div><small>Neu in der Crew · Lv ${save.roster[recruit].lvl}</small><br><b>${CHARS[recruit].name}</b><br><small>${CHARS[recruit].role} · ${GEMC[CHARS[recruit].color].name}/${GEMC[CHARS[recruit].sec].name} · ${CHARS[recruit].power.name}</small></div></div>` : ''}
    ${next === null && first ? '<p style="text-align:center;color:var(--muted)">Alle 1000 Level geschafft! Du kannst jedes Level wiederholen, um deine Crew weiter zu leveln.</p>' : ''}
    <div class="btns"><button class="btn sm ghost" id="wMap">Zur Karte</button>${next ? '<button class="btn sm ghost" id="wTeam">Team</button><button class="btn sm" id="wNext">Weiter</button>' : ''}</div></div>`;
  const toMap = () => { closeOv(); B = null; mapChap = Math.floor(((next || n) - 1) / 10); show('scrMap'); renderMap(); };
  $('#wMap').onclick = toMap;
  if (next) {
    $('#wNext').onclick = () => { closeOv(); startLevel(next); };
    $('#wTeam').onclick = () => { closeOv(); B = null; openTeam(next); };
  }
}
function lose() {
  B.active = false; B.busy = true; SND.lose();
  if (B.tut) { B.teamHp = B.teamMax; B.active = true; B.busy = false; refreshTeam(); toast('Im Tutorial verlierst du nicht. Weiter geht\'s!'); return; }
  const n = B.li, ov = $('#overlay'); ov.className = 'center'; ov.hidden = false;
  ov.innerHTML = `<div class="sheet"><p class="big lose">NIEDERLAGE</p>
    <p style="text-align:center">Die Crew musste sich zurückziehen. Tipp: Wiederhole frühere Level, um Erfahrung zu sammeln, und stell ein Team mit Farbvorteil gegen diese Gegner zusammen.</p>
    <div class="btns"><button class="btn sm ghost" id="lMap">Zur Karte</button><button class="btn sm ghost" id="lTeam">Team ändern</button><button class="btn sm" id="lAgain">Nochmal</button></div></div>`;
  $('#lMap').onclick = () => { closeOv(); B = null; show('scrMap'); renderMap(); };
  $('#lTeam').onclick = () => { closeOv(); B = null; openTeam(n); };
  $('#lAgain').onclick = () => { closeOv(); startLevel(n); };
}

/* ---------- Verdrahtung ---------- */
$('#helpBtn').onclick = helpSheet;
$('#mute').onclick = settingsSheet;
$('#setBtn').onclick = settingsSheet;
$('#toTeam').onclick = () => openTeam(null);
$('#teamDone').onclick = () => { teamFor = null; show('scrMap'); renderMap(); };
$('#startBtn').onclick = () => { const n = teamFor; teamFor = null; if (n) startLevel(n); };
$('#quitBtn').onclick = () => {
  if (!B) return;
  if (B.busy) return toast('Warte, bis der Zug vorbei ist.');
  const ov = $('#overlay'); ov.className = 'center'; ov.hidden = false;
  ov.innerHTML = `<div class="sheet"><h2>Rückzug?</h2><p>Der Fortschritt in diesem Einsatz geht verloren.</p>
    <div class="btns"><button class="btn sm ghost" id="qNo">Weiterkämpfen</button><button class="btn sm red" id="qYes">Rückzug</button></div></div>`;
  $('#qNo').onclick = closeOv;
  $('#qYes').onclick = () => { closeOv(); drag = null; B = null; $('#coach').hidden = true; show('scrMap'); renderMap(); };
};
function saveCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(save)))); }
$('#expBtn').onclick = () => {
  const ov = $('#overlay'); ov.className = 'center'; ov.hidden = false;
  ov.innerHTML = `<div class="sheet"><h2>Spielstand sichern</h2><p>Kopiere diesen Code und bewahre ihn auf, zum Beispiel in den Notizen. Mit „Spielstand laden“ holst du deinen Fortschritt zurück, auch auf einem anderen Gerät.</p>
    <textarea id="code" readonly style="width:100%;height:110px;font:12px monospace;border-radius:10px;border:2px solid var(--ink);padding:8px;box-sizing:border-box;background:#120c22;color:var(--text)">${saveCode()}</textarea>
    <div class="btns"><button class="btn sm ghost" id="cClose">Schließen</button><button class="btn sm" id="cCopy">Kopieren</button></div></div>`;
  $('#cClose').onclick = closeOv;
  $('#cCopy').onclick = () => { const t = $('#code'); navigator.clipboard && navigator.clipboard.writeText(t.value).then(() => toast('Code kopiert.'), () => { t.select(); toast('Markiere den Code und kopiere ihn.'); }); if (!navigator.clipboard) { t.select(); toast('Markiere den Code und kopiere ihn.'); } };
};
$('#impBtn').onclick = () => {
  const ov = $('#overlay'); ov.className = 'center'; ov.hidden = false;
  ov.innerHTML = `<div class="sheet"><h2>Spielstand laden</h2><p>Füge deinen gesicherten Code ein. Der aktuelle Spielstand wird dabei ersetzt.</p>
    <textarea id="code" style="width:100%;height:110px;font:12px monospace;border-radius:10px;border:2px solid var(--ink);padding:8px;box-sizing:border-box;background:#120c22;color:var(--text)"></textarea>
    <div class="btns"><button class="btn sm ghost" id="cClose">Abbrechen</button><button class="btn sm" id="cLoad">Laden</button></div></div>`;
  $('#cClose').onclick = closeOv;
  $('#cLoad').onclick = () => {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));
      if (!d || !d.roster || !d.roster.ilka || !Array.isArray(d.team)) throw 0;
      while (d.cleared.length < MAXN) d.cleared.push(false);
      save = d; persist(); closeOv(); mapChap = Math.floor((firstOpen() - 1) / 10); renderMap(); toast('Spielstand geladen.');
    } catch (e) { toast('Der Code ist ungültig. Prüfe, ob er vollständig kopiert wurde.'); }
  };
};
$('#resetBtn').onclick = () => {
  const ov = $('#overlay'); ov.className = 'center'; ov.hidden = false;
  ov.innerHTML = `<div class="sheet"><h2>Neu anfangen?</h2><p>Alle Levels, Figuren und Erfahrungspunkte werden gelöscht.</p>
    <div class="btns"><button class="btn sm ghost" id="rNo">Abbrechen</button><button class="btn sm red" id="rYes">Zurücksetzen</button></div></div>`;
  $('#rNo').onclick = closeOv;
  $('#rYes').onclick = () => { save = defSave(); persist(); mapChap = 0; closeOv(); renderMap(); };
};

renderMap();
requestAnimationFrame(frame);
if (!save.tutDone && !save.cleared[0]) setTimeout(() => startLevel(0), 300);
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
